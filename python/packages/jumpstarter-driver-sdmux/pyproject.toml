[project]
name = "jumpstarter-driver-sdmux"
version = "0.1.2"
description = "SDMux driver for Jumpstarter"
authors = [{ name = "Lorenz Burkhardt", email = "lorenzburkhardt0@gmail.com" }]
readme = "README.md"
license = { text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "jumpstarter",
]

[project.entry-points."jumpstarter.drivers"]
sdmux = "jumpstarter_driver_sdmux.driver:UsbSdMux"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"